
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Манхва — Глава 1</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      line-height: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <main id="chapter"></main>

  <script>
    const chapter = document.getElementById("chapter");

    for (let i = 2; i <= 83; i++) {
      const filename = `1_${String(i).padStart(3, "0")}.jpg`;

      const img = document.createElement("img");
      img.src = "images/" + filename;
      img.alt = `Глава 1 — фрагмент ${i}`;
      img.loading = i <= 3 ? "eager" : "lazy";

      chapter.appendChild(img);

      if (i === 19) {
        const extra = document.createElement("img");
        extra.src = "images/1_019_1.jpg";
        extra.alt = "Глава 1 — дополнительный фрагмент";
        extra.loading = "lazy";
        chapter.appendChild(extra);
      }
    }
  </script>
</body>
</html>
